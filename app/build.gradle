plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'id.bram.bigkeyboard'
    compileSdk 34

    defaultConfig {
        applicationId "id.bram.bigkeyboard.v3"
        minSdk 23
        targetSdk 34
        versionCode Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
        versionName "1.0-v3"
    }

    signingConfigs {
        // Kunci tetap (disimpan di repo) supaya setiap build bisa langsung
        // menimpa versi lama tanpa "App not installed".
        fixed {
            storeFile rootProject.file("keystore/bram-v3.jks")
            storePassword "bramkeyboard"
            keyAlias "bram"
            keyPassword "bramkeyboard"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
