name: Build APK

on:
  push:
    branches: [ main, master, dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bram.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/bram.jks" >> "$GITHUB_ENV"
            echo "Signing with fixed key"
          else
            echo "No KEYSTORE_BASE64 secret, using random debug key"
          fi

      - name: Build debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BramKeyboardV2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to Releases (dev branch only)
        if: github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BramKeyboardV2.apk
          gh release delete dev-latest --cleanup-tag --yes || true
          gh release create dev-latest BramKeyboardV2.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Bram Keyboard V2 (build ${{ github.run_number }})" \
            --notes "Auto-build dari commit ${GITHUB_SHA::7}"
